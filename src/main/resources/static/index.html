
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Expense Tracker</h1>
            <p>Record everyday spending and see your total.</p>
        </header>

        <form id="expense-form">
            <label for="description">
                Description
                <input
                    id="description"
                    type="text"
                    placeholder="e.g. Notebook"
                    required
                >
            </label>

            <label for="amount">
                Amount in ₹
                <input
                    id="amount"
                    type="number"
                    placeholder="150.00"
                    min="0.01"
                    step="0.01"
                    required
                >
            </label>

            <label for="category">
                Category
                <select id="category" required>
                    <option value="">Choose category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Books">Books</option>
                    <option value="College">College</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
            </label>

            <label for="date">
                Date
                <input id="date" type="date" required>
            </label>

            <button id="submit-button" type="submit">
                Add expense
            </button>
        </form>
        
<div class="date-filter">
    <label for="filter-date">View expenses for date</label>
    <input id="filter-date" type="date">

    <button id="filter-button" type="button">Filter date</button>
    <button id="show-all-button" type="button">Show all dates</button>
</div>


        <p id="message" role="status" aria-live="polite"></p>
        <p id="expense-count" hidden></p>

        <h2 id="total">Total spent ₹0.00</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expense-list">
                    <tr>
                        <td colspan="5" class="empty-state">
                            Loading expenses...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
